<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Door Lock - Local Connect</title>
    <style>
        .config-panel { padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; background: #f9f9f9; font-family: sans-serif; }
        .status-offline { color: #dc3545; font-weight: bold; }
        .status-online { color: #28a745; font-weight: bold; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<!-- IP Configuration Panel -->
<div class="config-panel">
    <h3>System Connection</h3>
    <p>Enter the ESP32 IP Address (e.g., 10.246.135.25):</p>
    <input type="text" id="ipAddress" placeholder="10.246.135.25">
    <button onclick="saveAndConnect()">Connect System</button>
    <span id="connStatus" class="status-offline">Offline</span>
</div>

<!-- Example Dashboard Controls -->
<div id="dashboard-controls">
    <button onclick="sendControlCommand('unlock')">Unlock Door</button>
    <button onclick="sendControlCommand('lock')">Lock Door</button>
</div>

<!-- Camera Stream -->
<div>
    <h3>Live Stream</h3>
    <img id="camStream" src="" alt="Camera Stream Offline" width="400" height="296" style="background:#222; border-radius: 8px;">
</div>

<script>
    // Global variables to hold the dynamic URLs
    let espBaseUrl = "";
    let espStreamUrl = "";

    // 1. Check for saved IP address when the page loads
    window.onload = function() {
        const savedIP = localStorage.getItem("esp32_ip");
        if(savedIP) {
            document.getElementById("ipAddress").value = savedIP;
            saveAndConnect(); // Automatically attempt connection
        }
    };

    // 2. Save the IP and establish connection
    function saveAndConnect() {
        const ip = document.getElementById("ipAddress").value.trim();
        if(!ip) {
            alert("Please enter a valid IP address.");
            return;
        }

        // Save to browser memory so it persists across refreshes
        localStorage.setItem("esp32_ip", ip);

        // Build the URLs (Port 80 for API, Port 81 for Stream)
        espBaseUrl = `http://${ip}`;
        espStreamUrl = `http://${ip}:81`; 

        document.getElementById("connStatus").innerText = "Connecting...";
        document.getElementById("connStatus").className = "status-offline";

        // Ping the ESP32 /status endpoint to verify connection
        fetch(`${espBaseUrl}/status`)
            .then(response => {
                if(response.ok) {
                    document.getElementById("connStatus").innerText = "Connected";
                    document.getElementById("connStatus").className = "status-online";
                    
                    // Activate the camera stream image source
                    document.getElementById("camStream").src = espStreamUrl;
                }
            })
            .catch(error => {
                document.getElementById("connStatus").innerText = "Connection Failed";
                document.getElementById("connStatus").className = "status-offline";
                console.error("Network Error: Could not reach ESP32.", error);
            });
    }

    // 3. Dynamic Fetch Function for all your API calls
    function sendControlCommand(action) {
        if(!espBaseUrl) {
            alert("System offline. Please connect to the ESP32 first.");
            return;
        }

        fetch(`${espBaseUrl}/control?state=${action}`)
            .then(res => res.text())
            .then(data => {
                console.log("ESP32 Response:", data);
            })
            .catch(err => {
                console.error("Failed to send command", err);
            });
    }
</script>

</body>
</html>
